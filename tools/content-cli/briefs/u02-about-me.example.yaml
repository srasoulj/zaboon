# Example unit brief for `pnpm content draft --brief tools/content-cli/briefs/u02-about-me.example.yaml`.
# Fields: see UnitBrief in tools/content-cli/src/draft.ts. Only `unit` and `theme` are required.
unit: u02-about-me
theme: Say who you are, where you're from and what you do
grammar:
  - "copula endings after consonants and vowels: -am, -i, -e / -st (STYLE.md §2.2)"
  - "possessive clitics on nouns: esmam, esmet, esmesh"
  - "اهل + place: man ahl-e irānam"
vocabulary:
  # Omit `existing` to allow everything introduced before this unit.
  new: [from (a place), Iran, where, student, teacher, city, Tehran]
characters: [kian, shirin]
levels: 3
sentencesPerLevel: 8
chatsPerLevel: 1
notes: Kian is a heritage learner; Shirin teases him gently about his accent.
