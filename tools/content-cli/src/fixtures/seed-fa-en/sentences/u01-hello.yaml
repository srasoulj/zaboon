# Unit 1 sentences (STYLE.md). `fa` keeps Persian punctuation; token surfaces carry none.
# `en`: the first path of the first pattern is the model answer; commas and a final ? live inside
# tokens/alternatives, never right after a ]. `faAccept` has no punctuation and its first pattern
# accepts `fa`; formal register, pronoun drop, ZWNJ and orthography variants are merged automatically.

