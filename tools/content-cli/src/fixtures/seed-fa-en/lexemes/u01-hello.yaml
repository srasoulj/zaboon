# Unit 1 lexemes. `fa` is colloquial Tehrani; `faFormal`/`translitFormal` only where the written
# form differs. `forms` lists the inflected surfaces used as sentence tokens (keys: person/number of
# the copula or clitic, e.g. 1sg = "I am …"; poss-2sg = "your …").
# Media (audio, image) and faVocalized come later from the pipeline.

# --- u01-l1: hello and thanks -------------------------------------------------------------------
- id: lx_salam
  fa: سلام
  translit: salām
  pos: interjection
  glosses: [hello, hi]
  introducedIn: u01-hello
  tags: [greeting]
  status: draft
  provenance: { author: claude-seed, notes: "hand-written seed; needs native review" }

- id: lx_khubi
  fa: خوبی؟
  faFormal: خوب هستی؟
  translit: "khubi?"
  translitFormal: "khub hasti?"
  pos: phrase
  glosses: ["how are you?", "are you well?"]
  introducedIn: u01-hello
  tags: [greeting, question]
  status: draft
  provenance: { author: claude-seed, notes: "hand-written seed; needs native review" }

- id: lx_khub
