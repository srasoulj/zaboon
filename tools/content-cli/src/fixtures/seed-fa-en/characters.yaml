# The cast (DESIGN-SYSTEM §7). Voices and Rive/art assets are added later by the pipeline.
# Colors are palette tokens; the palette has six colors for seven characters, so Kian shares
# firouzeh with Maman Bozorg (family resemblance).
- id: hodhod
  name: Hodhod
  nameFa: هدهد
  role: mascot
  bio: >-
    Hodhod the hoopoe is your guide along the path, just as the hoopoe leads the birds in Attar's
    Conference of the Birds. His saffron crest flares when you get something right and droops when
    you don't.
  color: zaferan
  image: characters/hodhod/expressions.webp
  status: draft
  provenance: { author: claude-seed, notes: "hand-written seed; needs native review" }

- id: maman-bozorg
  name: Maman Bozorg
  nameFa: مامان‌بزرگ
  role: grandmother
  bio: >-
    Maman Bozorg has the tea poured before you've taken off your shoes, and she is a grandmaster
    of ta'ārof. She will insist you eat more, no matter how many times you say no.
  color: firouzeh
  image: characters/maman-bozorg/portrait.webp
  status: draft
  provenance: { author: claude-seed, notes: "hand-written seed; needs native review" }

- id: shirin
  name: Shirin
  nameFa: شیرین
  role: university student
  bio: >-
    Shirin studies architecture at a university in Tehran and knows every café between her
    faculty and home. Her humor is bone-dry: she will tell you your accent is "almost perfect"
    with a completely straight face.
  color: lajvard
  status: draft
  provenance: { author: claude-seed, notes: "hand-written seed; needs native review" }

- id: dariush
  name: Dariush
  nameFa: داریوش
  role: taxi driver
  bio: >-
    Dariush drives a taxi in Tehran and has an opinion on everything, from the traffic to poetry
    to the price of tomatoes. He teaches directions, numbers and the city, whether you asked or not.
  color: pesteh
  status: draft
  provenance: { author: claude-seed, notes: "hand-written seed; needs native review" }

- id: kian
  name: Kian
  nameFa: کیان
  role: heritage learner
  bio: >-
    Kian was born in Los Angeles and grew up hearing Persian at home, but he never learned to read
    it. He is learning alongside you and isn't afraid to make mistakes out loud.
  color: firouzeh
  status: draft
  provenance: { author: claude-seed, notes: "hand-written seed; needs native review" }

- id: leila
  name: Leila
  nameFa: لیلا
  role: chef
  bio: >-
    Leila runs a small kitchen near the bazaar that is famous for its tahdig. She teaches food words
    the best way she knows: by making you taste everything.
  color: anar
  status: draft
  provenance: { author: claude-seed, notes: "hand-written seed; needs native review" }

- id: babak
  name: Babak
  nameFa: بابک
  role: santur player
  bio: >-
    Babak plays the santur and has a line of Hafez ready for every occasion. He brings music, poetry
    and a little history into the course.
  color: bademjan
  status: draft
  provenance: { author: claude-seed, notes: "hand-written seed; needs native review" }
