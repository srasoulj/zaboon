# ORACLE: packages/farsi normalize() and looseKey() -- READ-ONLY, owned by the orchestrator.
# Workers implementing packages/farsi must make every case pass and must not edit this file.
# Rules: docs/LEARNING-ENGINE.md section 1.5, as pinned by the orchestrator:
#   normalized = normalize(input): NFC; ي/ى->ی, ك->ک; strip bidi controls (U+200E/F, U+202A-E,
#     U+2066-9), BOM, ZWSP, ZWJ, tatweel, diacritics U+064B-U+0652 and U+0670; digits -> ASCII;
#     NBSP -> space; strip the punctuation ، ؛ ؟ « » . ! ? , ; : ; then collapse whitespace runs to one
#     space and trim. ZWNJ (U+200C) is KEPT. No case folding.
#   loose = looseKey(input): the normalized form, then ە/ة->ه, ۀ and هٔ->ه, word-final ه + ZWNJ + ی
#     (written ezāfe)->ه (ه‌ای and a non-final ه‌ی are NOT folded), أ/إ/ٱ->ا, ئی->یی, remove every
#     ZWNJ, and remove the space after a whole-token prefix می/نمی and before a whole-token suffix
#     ها های ی ای تر ترین ام ات اش مان تان شان.
# Escapes: every string is YAML double-quoted. Invisible characters, combining marks and look-alike
# non-Persian letters/digits (Arabic ي ى ك ة ە ۀ أ إ ٱ and Arabic-Indic digits) are written as
# \uXXXX escapes; any literal Persian letter or digit is the standard Persian code point.

