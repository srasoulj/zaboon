# ORACLE: packages/grader golden grading cases -- READ-ONLY, owned by the orchestrator.
# Workers implementing packages/grader (and packages/farsi) must make every case pass and must not
# edit this file. Field reference and comparison rules: packages/grader/oracles/README.md.
# Rules (docs/LEARNING-ENGINE.md sections 3 and 7, as pinned by the orchestrator):
#   correct  - exact DAG match after normalization (Persian: looseKey, in which a written ezāfe ه‌ی
#              folds to ه like ۀ/هٔ; English: lowercase, U+2019/U+2018/U+02BC read as ASCII ', strip
#              punctuation, expand I'm/you're/it's/don't/can't/I'd, US/UK spellings, number words = digits).
#   typo     - a small edit inside one token: <=1 edit for tokens of 4+ letters, <=2 for 8+, none for
#              shorter tokens; mixing up آ and ا is a typo at any length. A typo whose result is
#              exactly a `lexicon` word is wrong.
#   spelling - one Persian letter of a token swapped for a same-sound letter (ز ذ ض ظ / س ص ث / ت ط /
#              ه ح / غ ق) at any length; this takes precedence over the typo rule. It is wrong instead
#              when the swapped token is in `lexicon`.
#   negation - adding or removing the negative prefix ن (نمی‌ / نمی / ن) on a verb is wrong in every
#              mode, never a typo, although it is one edit.
#   wrong    - any wrong, missing or extra token. Verdict = worst operation on the minimum-cost path.
#   merges   - faFormal: per-token alternatives when its token count equals the pattern's (so mixed
#              register is accepted), otherwise an extra pattern; pronoun drop applies to every pattern;
#              variant sets are symmetric and may span several tokens.
#   bank     - exact membership in the same merged DAG; never typo or spelling.
# Cases avoid anything the rules leave open (edit metric, whose length sets the limit, typo-vs-
# spelling ranking, exact costs); `closest` is given only when one best path wins under any
# reasonable cost weights.
# Escapes: strings are YAML double-quoted; ZWNJ is written \u200C and every other invisible
# character, combining mark, look-alike Arabic letter/digit or typographic apostrophe is a \uXXXX escape.

