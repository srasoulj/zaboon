# ORACLE (read-only, orchestrator-owned; see README.md): league placement and weekly rollover.
# Config: leagues.cohortSize 30, promote 7, demote 5. Tiers low -> high: mes, noqreh, tala,
# firouzeh, aqiq, lajvard, yaqut, zomorrod, morvarid, almas.
#
# rule placement: input {cohorts: open cohorts of one (week, tier) as {id, size, createdOrder}}
#   -> expected {cohortId, newCohort}: the fullest cohort with size < 30 (ties: lowest
#   createdOrder), or {cohortId: null, newCohort: true} when none is open.
# rule rollover: input {tier, members: [{userId, weeklyXp}]} -> expected {promoteCount,
#   demoteCount, promotedTo, demotedTo, ranking, promoted, demoted}. ranking = weeklyXp desc, ties
#   by userId ascending (string order). promoteCount = min(7, ceil(n/4)), 0 in almas; demoteCount =
#   min(5, floor(n/5)), 0 in mes. promoted/demoted are in rank order and move one tier; the rest
#   stay. Promotion wins if a member would be both (unreachable with these defaults).

- id: lp-01-no-cohort-yet
  rule: placement
  note: >-
    No open cohort for (week, tier): create a new one.
  input:
    cohorts: []
  expected:
    cohortId: null
    newCohort: true

- id: lp-02-single-open-cohort
  rule: placement
  note: >-
    The only open cohort is joined.
  input:
    cohorts:
      - { id: c1, size: 12, createdOrder: 1 }
  expected:
    cohortId: c1
    newCohort: false

- id: lp-03-fullest-open-wins
  rule: placement
  note: >-
    The fullest cohort with size < 30 wins (29), whatever its position.
  input:
    cohorts:
      - { id: c1, size: 12, createdOrder: 1 }
      - { id: c2, size: 29, createdOrder: 2 }
      - { id: c3, size: 5, createdOrder: 3 }
  expected:
    cohortId: c2
    newCohort: false

- id: lp-04-full-cohort-skipped
  rule: placement
  note: >-
    A cohort at 30 is full and skipped. The fullest open one is 25.
  input:
    cohorts:
      - { id: c1, size: 30, createdOrder: 1 }
      - { id: c2, size: 18, createdOrder: 2 }
      - { id: c3, size: 25, createdOrder: 3 }
  expected:
    cohortId: c3
    newCohort: false

- id: lp-05-all-full
  rule: placement
  note: >-
    Every cohort is full: create a new one.
  input:
    cohorts:
      - { id: c1, size: 30, createdOrder: 1 }
      - { id: c2, size: 30, createdOrder: 2 }
  expected:
    cohortId: null
    newCohort: true

- id: lp-06-tie-lowest-createdOrder
  rule: placement
  note: >-
    Size tie (20, 20): the lowest createdOrder (3) wins.
  input:
    cohorts:
      - { id: c7, size: 20, createdOrder: 7 }
      - { id: c3, size: 20, createdOrder: 3 }
      - { id: c5, size: 11, createdOrder: 5 }
  expected:
    cohortId: c3
    newCohort: false

- id: lp-07-tie-after-skipping-full
  rule: placement
  note: >-
    The full cohort is skipped. Among the open ones, 17 vs 17 is decided by createdOrder 2 < 4.
  input:
    cohorts:
      - { id: a1, size: 30, createdOrder: 1 }
      - { id: b4, size: 17, createdOrder: 4 }
      - { id: c2, size: 17, createdOrder: 2 }
      - { id: d3, size: 9, createdOrder: 3 }
  expected:
    cohortId: c2
    newCohort: false

- id: lp-08-empty-cohort-is-open
  rule: placement
  note: >-
    A cohort with 0 members is open (0 < 30).
  input:
    cohorts:
      - { id: c1, size: 0, createdOrder: 1 }
  expected:
    cohortId: c1
    newCohort: false

- id: lp-09-size-beats-age
  rule: placement
  note: >-
    createdOrder only breaks ties. The fuller cohort (29) wins over an older one.
  input:
    cohorts:
      - { id: c2, size: 28, createdOrder: 1 }
      - { id: c1, size: 29, createdOrder: 5 }
  expected:
    cohortId: c1
    newCohort: false

