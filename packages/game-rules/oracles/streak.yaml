        frozenDates: ['2026-05-18']
        freezeGranted: false
      - state: { current: 1, longest: 5, lastActiveDate: '2026-05-20', freezes: 0 }
        frozenDates: []
        freezeGranted: false
    final: { current: 1, longest: 5, lastActiveDate: '2026-05-20', freezes: 0 }

