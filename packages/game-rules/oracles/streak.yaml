- id: st-32-out-of-order-commits-can-break
  rule: applyActivity
  note: >-
    Commits from two devices arrive out of order: May 20 first (gap May 18-19 = 2 > 1 freeze, so May
    18 is frozen and the streak restarts), then May 18 (< lastActiveDate, ignored). In date order
    the same two sessions would have given 6 then 7: commit order matters.
  input:
    initial: { current: 5, longest: 5, lastActiveDate: '2026-05-17', freezes: 1 }
