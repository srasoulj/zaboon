# Frozen e2e fixture: READ-ONLY for workers (see content/fixtures/README.md).
# u01-s0 is the short first lesson (the walking skeleton's four types); u01-l1 pins the 8 course
# challenge types and u01-l2 the 5 letter types, in this exact order.
id: u01-fixture
title: Fixture unit
subtitle: Hello, tea and first letters
register: colloquial
color: firouzeh
guidebook: guidebooks/u01-fixture.md
characters: [leila]
levels:
  - id: u01-s0
    kind: lesson
    title: First steps
    lessons: 1
    spec:
      focus:
        lexemes: [lx_salam, lx_mersi, lx_khub, lx_man, lx_ab, lx_mikham, lx_maman, lx_baba]
        sentences: [s_u01_0001, s_u01_0002, s_u01_0006]
        letters: []
        chats: []
      mix: intro
      pinnedOnly: true
      pinned:
        - { type: select_translation, direction: fa_en, items: [s_u01_0001] }
        - { type: translate_bank, direction: fa_en, items: [s_u01_0002] }
        - { type: translate_type, direction: fa_en, items: [s_u01_0006] }
        - { type: match_pairs, items: [lx_salam, lx_mersi, lx_maman, lx_baba, lx_khub] }
  - id: u01-l1
    kind: lesson
    title: Course challenges
    lessons: 1
    spec:
      focus:
        lexemes:
          [lx_ab, lx_nun, lx_chay, lx_sib, lx_salam, lx_mersi, lx_maman, lx_baba, lx_khub, lx_man, lx_mikham]
        sentences: [s_u01_0001, s_u01_0002, s_u01_0003, s_u01_0005, s_u01_0006, s_u01_0007, s_u01_0008]
        letters: []
        chats: [c_u01_001]
      mix: intro
      pinnedOnly: true
      pinned:
        - { type: select_image, items: [lx_ab], distractors: [lx_nun, lx_chay, lx_sib] }
        - { type: select_translation, direction: fa_en, items: [s_u01_0001] }
        - { type: translate_bank, direction: fa_en, items: [s_u01_0002] }
        - { type: translate_bank, direction: en_fa, items: [s_u01_0003] }
        - { type: translate_type, direction: fa_en, items: [s_u01_0006] }
        - { type: match_pairs, items: [lx_salam, lx_mersi, lx_maman, lx_baba, lx_khub] }
        - { type: listen_tap, items: [s_u01_0005] }
        - { type: cloze_choice, items: [s_u01_0007] }
        - { type: complete_chat, items: [c_u01_001] }
  - id: u01-l2
    kind: lesson
    title: Letter challenges
    lessons: 1
    spec:
      focus:
        lexemes: [lx_baba, lx_sib]
        sentences: []
        letters: [l_be, l_mim, l_nun]
        chats: []
      mix: letters
      pinnedOnly: true
      pinned:
        - { type: letter_intro, items: [l_be] }
        - { type: letter_sound, items: [l_be] }
        - { type: letter_forms, items: [l_be, l_mim, l_nun] }
        - { type: read_word, items: [lx_baba] }
        - { type: build_word, items: [lx_sib] }
  - id: u01-p1
    kind: practice
    title: Practice
  - id: u01-r1
    kind: unit_review
    title: Unit review
  # Wave 3 (P2): typed Persian and letter tracing. Last on the path, so every MVP level before it
  # (and every MVP test) is unaffected; its focus items all appear in the levels above, so the
  # unit's bundle and the unit review's pools are unchanged.
  - id: u01-t1
    kind: lesson
    title: Typing and tracing
    lessons: 1
    spec:
      focus:
        lexemes: [lx_nun, lx_chay, lx_sib, lx_mikham]
        sentences: [s_u01_0003, s_u01_0005, s_u01_0007]
        letters: [l_be]
        chats: []
      mix: standard
      pinnedOnly: true
      pinned:
        - { type: translate_type, direction: en_fa, items: [s_u01_0003] }
        - { type: listen_type, items: [s_u01_0005] }
        - { type: cloze_type, items: [s_u01_0007] }
        - { type: letter_trace, items: [l_be] }
  # Wave 4 (P2): speaking. Appended after u01-t1, so every earlier level is unaffected; its focus
  # items all appear in the levels above. With flags.speak off the speak pins play listen_tap.
  - id: u01-v1
    kind: lesson
    title: Speaking
    lessons: 1
    spec:
      focus:
        lexemes: [lx_salam, lx_khub, lx_sib, lx_mikham, lx_chay]
        sentences: [s_u01_0001, s_u01_0005, s_u01_0007]
        letters: []
        chats: []
      mix: standard
      pinnedOnly: true
      pinned:
        - { type: speak, items: [s_u01_0001] }
        - { type: speak, items: [s_u01_0007] }
        - { type: listen_tap, items: [s_u01_0005] }
status: approved
provenance: { author: fixtures }
