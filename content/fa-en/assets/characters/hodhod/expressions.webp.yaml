promptText: |-
  Create a character expression sheet for Hodhod, the original hoopoe mascot shown in the attached turnaround sheet.

  The attached images are references: the first defines the flat shape language, corner radius and palette; the second is Hodhod's approved turnaround. Keep Hodhod exactly on model: same proportions, same crest, beak, eyes, cinnamon body and banded ink-and-white wings.

  Canvas: square, plain pure white background (#FFFFFF), generous margins, nothing touching the edges.

  Layout: five poses of the same character, all the same size, in two rows (three on top, two centered below), evenly spaced, each in a three-quarter view facing slightly toward the viewer. The crest is the main emotion display:
  (1) Idle: calm and friendly, eyes open, beak closed, crest relaxed and half-raised, wings folded.
  (2) Happy: eyes closed into happy upward arcs, beak slightly open in a smile, crest raised and fanned, one wing lifted in a small wave.
  (3) Sad: eyes looking down under worried ink eyebrows, head lowered, crest drooping flat backward, wings hanging low.
  (4) Thinking: eyes looking up to one side, one wing tip raised to the base of the beak like a hand on a chin, crest tilted with its feathers at slightly uneven angles.
  (5) Celebrate: jumping up with both wings raised high, happy arc eyes, beak open, crest fully flared into a wide bright fan; a few small round saffron, turquoise and pomegranate confetti dots nearby.
  No ground line and no shadows.

  Hodhod's design (identical in every view):
  - Silhouette: a small, upright, friendly bird with a distinct round head, a short neck, a pear-shaped body a little taller than it is wide, a short rounded ink tail and two short ink legs with rounded feet. Nothing like an owl: no ear tufts, no huge goggle eyes, no ball-shaped body.
  - Crest: a tall fan-shaped crest on top of the head made of six rounded, pill-shaped saffron (#FFB020) feathers, each ending in a rounded ink (#2F2F2F) tip. The crest is the most recognizable part of the silhouette.
  - Head and body: warm cinnamon (#D98A00), one flat color.
  - Wings: ink (#2F2F2F) wings folded against the sides, crossed by three bold white stripes; each white stripe stays inside the ink wing shape and never reaches the wing's outer edge. The tail has one white stripe inside it.
  - Beak: long, slender, gently down-curved ink beak with a clearly rounded, blunt tip (no point).
  - Eyes: medium-small ink oval eyes, each with one tiny white highlight dot, set on the sides of the head.

  Colors: use ONLY these exact solid colors:
  - #0E9F99 turquoise
  - #FFB020 saffron
  - #2D5BD7 lapis blue
  - #E5484D pomegranate red
  - #7B4BC4 eggplant purple
  - #8CC63F pistachio green
  - #2F2F2F ink (dark charcoal)
  - #FFFFFF white
  - #D98A00 cinnamon (Hodhod's head and body only)

  Style rules (strict):
  - Flat vector illustration built only from circles, pills (fully rounded rectangles), rounded rectangles and rounded triangles.
  - Every corner is rounded: no sharp points or pointed tips anywhere.
  - No outlines or strokes of any kind. No gradients, no shading, no textures, no drop shadows, no 3D effects, no glow. Every shape is one flat solid fill.
  - Absolutely no text, letters, numbers, labels, captions, logos, signatures or watermarks anywhere in the image.
