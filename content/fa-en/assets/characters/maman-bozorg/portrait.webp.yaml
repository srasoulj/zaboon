promptText: |-
  Create a friendly head-and-shoulders portrait of an original character for a cheerful app that teaches Persian (Farsi) to English speakers.

  The attached images are references: the first defines the flat shape language, corner radius and palette; the second shows the app's mascot drawn in the same style. Match their clean flat style, simplicity and soft rounded shapes. The mascot bird must NOT appear in this image.

  Canvas: square, plain pure white background (#FFFFFF). One bust, centered, generous margins above and at the sides; the shoulders are cut off by a straight horizontal line near the bottom of the image. The character faces slightly toward the viewer (three-quarter view) with a warm, friendly expression.

  Character: Maman Bozorg, a warm, cheerful Iranian grandmother in her early seventies. She has a soft round face, kind smiling eyes and a big welcoming smile. Short silver-grey hair shows at the front of a loose, softly draped saffron (#FFB020) headscarf with a few small white dots, pushed back on her head. She wears a turquoise (#0E9F99) cardigan over a lapis-blue (#2D5BD7) top, and small round saffron earrings. In one hand she holds up a small tulip-shaped tea glass (a pomegranate-red glass shape with a saffron rim) on a small lapis saucer, offering it to the viewer.

  Colors: the clothing is mostly turquoise (#0E9F99), the character's signature color. Other details use only these palette colors:
  - #0E9F99 turquoise
  - #FFB020 saffron
  - #2D5BD7 lapis blue
  - #E5484D pomegranate red
  - #7B4BC4 eggplant purple
  - #8CC63F pistachio green
  - #2F2F2F ink (dark charcoal)
  - #FFFFFF white
  Skin: light warm skin #F2C7A5 (flat), with #E0A882 only for the nose and ear shapes. Hair: silver-grey #B8B8B8.
  White is used only for small details inside the figure (eye highlights, teeth, a collar); the outer edge of the figure is never white.

  Construction: the head is a rounded shape; eyes are ink ovals with one tiny white highlight each; eyebrows are short ink pills; the mouth is a simple rounded ink shape; hair and clothing are built from large rounded shapes. A respectful, contemporary Iranian person in everyday modern clothing, natural proportions, no caricature or exaggerated features.

  Style rules (strict):
  - Flat vector illustration built only from circles, pills (fully rounded rectangles), rounded rectangles and rounded triangles.
  - Every corner is rounded: no sharp points or pointed tips anywhere.
  - No outlines or strokes of any kind. No gradients, no shading, no textures, no drop shadows, no 3D effects, no glow. Every shape is one flat solid fill.
  - Absolutely no text, letters, numbers, labels, captions, logos, signatures or watermarks anywhere in the image.
